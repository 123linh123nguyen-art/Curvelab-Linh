services:
  - type: web
    runtime: static
    name: curvelab
    buildCommand: echo "CurveLab is a static site; no build step is required."
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: redirect
        source: /studio
        destination: /studio.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
